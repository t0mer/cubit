openapi: 3.0.3

info:
  title: Cubit API
  version: "1"
  description: |
    Cubit authenticates against the Israeli Cibus / Pluxee consumer platform,
    reads the meal-card balance, and reports how many fixed-denomination
    vouchers that balance covers.

    Logging in needs a human: Pluxee sends a one-time code out of band, so the
    service parks in `AWAITING_OTP` until someone posts the code back.

        IDLE --login--> AWAITING_OTP --otp--> AUTHENTICATED

    Pluxee also enforces reCAPTCHA on its login endpoint, and its tokens are
    single-use and short-lived, so **cubit cannot log in unattended**. Day to
    day this does not bite: a session obtained once is held encrypted at rest
    and reused across restarts without a new OTP. It matters only when that
    session finally expires, at which point re-authentication is a manual,
    browser-assisted act.

  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: This instance

tags:
  - name: auth
    description: The login state machine
  - name: balance
    description: Balance and voucher arithmetic
  - name: ops
    description: Probes and metrics

security:
  - apiToken: []
  - basicAuth: []

paths:
  /healthz:
    get:
      tags: [ops]
      summary: Liveness
      description: Always open, so an orchestrator probe needs no credentials.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: 2026.9.0 }

  /readyz:
    get:
      tags: [ops]
      summary: Readiness
      description: |
        Ready only when the state is `AUTHENTICATED`. Always open, like
        `/healthz`.
      security: []
      responses:
        "200":
          description: A usable Pluxee session is held.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
                  state: { $ref: "#/components/schemas/State" }
        "503":
          description: No usable session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: not ready }
                  state: { $ref: "#/components/schemas/State" }

  /metrics:
    get:
      tags: [ops]
      summary: Prometheus metrics
      responses:
        "200":
          description: Metrics in the Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/credentials:
    post:
      tags: [auth]
      summary: Supply Cibus credentials at runtime
      description: |
        Credentials do not have to come from configuration. Post them here and
        cubit uses them for the next login.

        **Held in memory only.** They are never written to disk, so a restart
        drops them. A restart with a valid persisted session is unaffected: it
        reaches `AUTHENTICATED` with no OTP and no credentials.

        **Refuses to run on an unguarded instance.** Every other route is open
        when no API token is configured, which is deliberate first-run
        behaviour, but an open endpoint that accepts the password to a financial
        account is a different proposition — so this one returns `412` until a
        token is set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialsRequest" }
            examples:
              usual:
                summary: The usual case — username and password only
                value:
                  username: "0501234567"
                  password: "your-cibus-password"
              withCompany:
                summary: Only when the Cibus login screen shows a company field
                value:
                  username: "0501234567"
                  password: "your-cibus-password"
                  company: "acme"
      responses:
        "204":
          description: |
            Stored. The body is empty: the password is never echoed back, and
            never appears in a log line at any level.
        "400":
          description: |
            Malformed JSON, an unrecognised field, a body over 4 KiB, or either
            half of the pair empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: A login is awaiting an OTP. Answer it or let it expire first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "412":
          description: No API token is configured, so this endpoint is disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/browser:
    post:
      tags: [auth]
      summary: Arm cubit for a browser-assisted login
      description: |
        Called by the `cubit-login` helper. Pluxee enforces reCAPTCHA on both
        the credential post **and** the OTP submission, and only a real browser
        can mint a token, so the helper owns the exchange with Pluxee while
        cubit does two small things: catch the code the user's phone posts to
        `/api/v1/auth/otp`, and adopt the session the helper captures.

        This call never touches the Pluxee backend — there is no challenge here
        to submit against. It only moves the state machine to `AWAITING_OTP` so
        an arriving code is accepted, and starts the challenge TTL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                masked_target:
                  type: string
                  description: Masked destination, for display only.
                  example: "***-***1865"
                method:
                  type: string
                  example: phone
              additionalProperties: false
      responses:
        "202":
          description: Armed. Post the code to `/api/v1/auth/otp` when it arrives.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "400":
          description: Malformed body or an unrecognised field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            A login is already awaiting an OTP, or cubit is already
            authenticated. A held session is worth more than a new login, so
            arming the relay will not discard one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "412":
          description: No API token is configured, so browser handoff is disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/browser/otp:
    get:
      tags: [auth]
      summary: Collect the parked OTP
      description: |
        Polled by the `cubit-login` helper until the user's phone posts the code.

        **Single-use.** The code is a live credential for the few minutes it
        exists, so it is handed over exactly once and a repeat poll returns
        `204`. It is held in memory only and never written to disk or logged.
      responses:
        "200":
          description: The code, handed over for the only time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: "123456" }
        "204":
          description: No code parked — either none has arrived, or it was already collected.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "412":
          description: No API token is configured, so browser handoff is disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: End the session
      description: |
        Revokes the session at Pluxee — the same `prx_logout` call the web app
        makes when a user signs out — and then clears it locally: cookies out of
        memory, `token.enc` deleted, state back to `IDLE`.

        Revoking upstream is **best effort**. If Pluxee cannot be reached the
        session is still cleared locally and the reason is logged, because a
        backend outage must not leave a live session sitting on disk. The
        upstream call is attempted first, since after the local wipe there are
        no cookies left to revoke with.

        Idempotent: logging out with nothing held is a success, so a caller can
        always reach a known state without checking first. Nothing is sent
        upstream in that case — there is nothing to revoke.
      responses:
        "204":
          description: |
            Logged out. Returned even when the upstream revocation failed; the
            local session is gone either way.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: The logout could not be completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/session:
    post:
      tags: [auth]
      summary: Adopt a session captured by the helper
      description: |
        Hands cubit the cookies from a completed browser login.

        The session is validated before it is trusted — cubit makes one balance
        call with it — because storing a dead session would leave the service
        looking authenticated while every read failed. A session that works is
        persisted encrypted, and the state becomes `AUTHENTICATED`.

        Refuses to run on an unguarded instance: a session cookie is as good as
        the password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionImport" }
      responses:
        "204":
          description: Session adopted, validated and persisted. No body.
        "400":
          description: |
            Malformed body, an empty cookie jar, or a session Pluxee does not
            accept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "412":
          description: No API token is configured, so browser handoff is disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Pluxee could not be reached, so the session could not be validated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Begin a login
      description: |
        Triggers the OTP to the account holder. Exactly one login may be in
        flight: a second call while a challenge is outstanding returns `409`
        rather than silently sending another message.

        **Pluxee enforces reCAPTCHA on its login endpoint**, verified against a
        real account on 2026-09-09: the same credentials return `210` (OTP sent)
        when a captcha token accompanies them and `401` when one does not.
        Because reCAPTCHA v3 tokens are single-use and expire in about two
        minutes, one cannot be captured and reused, so an unattended login will
        normally fail here with `412`. A session already held in `token.enc` is
        unaffected — it is reused without logging in again.
      responses:
        "200":
          description: The backend authenticated outright; no OTP is needed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "202":
          description: An OTP was sent. The masked destination is in the body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "401":
          description: |
            Either the request carried no valid API token, or Pluxee rejected
            the credentials.

            Note that a credential rejection is only reported when a reCAPTCHA
            token was actually configured. Without one, Pluxee answers `401` to
            correct credentials too, so that case is reported as `412` rather
            than blaming a password that may be perfectly good.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "409":
          description: A login is already awaiting an OTP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "412":
          description: |
            The login could not even be attempted. One of:

            - no credentials are held — post them to `/api/v1/auth/credentials`;
            - **a reCAPTCHA token is required** and none is configured. This is
              the expected outcome for an unattended login; re-authentication
              has to be done with a browser;
            - the account has no phone number on file, so no OTP can be
              delivered.

            The `message` field says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "502":
          description: |
            The Pluxee backend could not be reached, or it signalled an OTP
            challenge while withholding the opaque handle needed to answer it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }

  /api/v1/auth/otp:
    post:
      tags: [auth]
      summary: Submit the OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OTPRequest" }
      responses:
        "200":
          description: Authenticated. The session is persisted, encrypted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "202":
          description: |
            The code was received and parked for a browser-assisted login to
            complete. Returned when the login was started by the `cubit-login`
            helper rather than by cubit: the helper holds the challenge and can
            mint the captcha token the submission needs, so cubit relays the
            code instead of submitting it.

            This is the response a phone-side auto-forwarder should expect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "400":
          description: Malformed body, an unrecognised field, or an empty code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: |
            Wrong code. `attempts_remaining` says how many are left before the
            challenge is torn down and a fresh login is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "409":
          description: No OTP is pending; start a login first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "410":
          description: The challenge outlived its TTL. Start a new login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/auth/status:
    get:
      tags: [auth]
      summary: Current authentication state
      responses:
        "200":
          description: The state machine's current position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/balance:
    get:
      tags: [balance]
      summary: Balance and voucher calculation
      description: |
        All money is handled as `int64` agorot; the decimal strings alongside
        each figure are for display only.
      responses:
        "200":
          description: The current balance and what it buys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503":
          description: |
            Not authenticated. The body carries the auth state, so the caller
            can tell whether an OTP is pending or credentials are missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }

components:
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: X-API-Token
      description: |
        Guards `/api/v1` and `/metrics`. `/healthz`, `/readyz` and `/api/docs`
        are always open.

        **Bootstrap mode:** when no token is configured, `/api/v1` and
        `/metrics` are open to anyone who can reach the port. That is deliberate
        first-run behaviour — the service must be reachable before it is
        configured — and the process logs a warning at startup while it lasts.
        `POST /api/v1/auth/credentials` is the one exception: it refuses to
        operate until a token is set.
    basicAuth:
      type: http
      scheme: basic
      description: |
        The same token, presented as the password half of basic auth. The
        username is ignored. Comparison is constant-time.

  responses:
    Unauthorized:
      description: An API token is configured and the request did not carry it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: The Pluxee backend could not be reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthStatus" }

  schemas:
    State:
      type: string
      enum: [IDLE, AWAITING_OTP, AUTHENTICATED]
      description: |
        `IDLE` — nothing in flight.
        `AWAITING_OTP` — a code was sent and is awaited.
        `AUTHENTICATED` — a usable session is held.

    Error:
      type: object
      properties:
        error: { type: string }

    CredentialsRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Cibus / Pluxee username. Surrounding whitespace is trimmed.
          example: alice
        password:
          type: string
          format: password
          description: Cibus / Pluxee password.
        company:
          type: string
          description: |
            **Optional — omit it entirely unless the Cibus login screen actually
            shows a company field.** Most accounts do not need one; verified
            against a real account on 2026-09-09 that logging in with no company
            succeeds.

            Do not try to determine this by calling `/auth/showCompanyField`
            yourself without a reCAPTCHA token: it answers `true` without one and
            `false` with one, for the same username.
      additionalProperties: false

    SessionImport:
      type: object
      required: [cookies]
      properties:
        cookies:
          type: array
          minItems: 1
          description: The cookie jar captured from the browser after login.
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string, example: "token" }
              value:
                type: string
                format: password
                description: Treated as a secret; never logged or echoed back.
              domain: { type: string, example: ".pluxee.co.il" }
              path: { type: string, example: "/" }
              secure: { type: boolean }
              httpOnly: { type: boolean }
              expires:
                type: number
                description: Unix seconds, as Chrome DevTools reports it.
            additionalProperties: false
      additionalProperties: false

    OTPRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The one-time code delivered by SMS or voice call.
          example: "123456"
      additionalProperties: false

    AuthStatus:
      type: object
      properties:
        state: { $ref: "#/components/schemas/State" }
        credentials_configured:
          type: boolean
          description: |
            Whether a login could be started at all, or credentials still need
            posting to `/api/v1/auth/credentials`.
        masked_target:
          type: string
          description: Masked destination the OTP was sent to.
          example: 05*-***1234
        delivery_method:
          type: string
          description: How the OTP was delivered.
          example: sms
        attempts_remaining:
          type: integer
          description: Wrong codes left before the challenge is torn down.
          example: 2
        challenge_expires_at:
          type: string
          format: date-time
        authenticated_at:
          type: string
          format: date-time
        message:
          type: string
          description: |
            Human-readable detail — which precondition failed, how many OTP
            attempts remain, and so on. Never contains a credential.
      required: [state, credentials_configured]

    BalanceReport:
      type: object
      properties:
        balance_agorot:
          type: integer
          format: int64
          example: 27350
        balance: { type: string, example: "273.50" }
        currency: { type: string, example: ILS }
        voucher_value_agorot:
          type: integer
          format: int64
          example: 5000
        voucher_value: { type: string, example: "50.00" }
        vouchers_affordable:
          type: integer
          format: int64
          description: Integer division of the balance by the denomination.
          example: 5
        remainder_agorot:
          type: integer
          format: int64
          example: 2350
        remainder: { type: string, example: "23.50" }
        restaurant_id: { type: string, example: "31999" }
        checked_at: { type: string, format: date-time }
      required:
        - balance_agorot
        - balance
        - currency
        - voucher_value_agorot
        - voucher_value
        - vouchers_affordable
        - remainder_agorot
        - remainder
        - restaurant_id
        - checked_at
